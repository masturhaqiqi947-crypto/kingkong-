# kingkong-
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingkong Pragmatic Simulation</title>
    <style>
        body {
            background-color: #1a0f07;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-container {
            background: linear-gradient(145deg, #2a1810, #150a04);
            border: 4px solid #ffd700;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            width: 320px;
        }

        h1 {
            color: #ffd700;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px #000;
        }

        .slot-machine {
            display: flex;
            justify-content: space-around;
            background: #000;
            border: 3px solid #ff8c00;
            border-radius: 10px;
            padding: 15px 5px;
            margin: 20px 0;
            font-size: 3rem;
        }

        .reel {
            width: 80px;
            height: 80px;
            background: #222;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px #000;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .spin-btn {
            background: linear-gradient(180deg, #ff8c00, #ff0000);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
            transition: transform 0.1s, background 0.3s;
        }

        .spin-btn:active {
            transform: scale(0.95);
        }

        .spin-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .msg {
            height: 25px;
            color: #00ffcc;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🦍 KINGKONG 🦍</h1>
    <p style="margin:0; font-size:0.8rem; color:#aaa;">Pragmatic Style Simulator</p>

    <div class="slot-machine">
        <div class="reel" id="reel1">🦍</div>
        <div class="reel" id="reel2">🍌</div>
        <div class="reel" id="reel3">💎</div>
    </div>

    <div class="controls">
        <div class="info-panel">
            <span>Saldo: <span id="balance" style="color:#00ff00;">1000</span></span>
            <span>Taruhan: <span id="bet">50</span></span>
        </div>

        <button class="spin-btn" id="spinBtn" onclick="spin()">PUTAR / SPIN</button>
    </div>

    <div class="msg" id="msg"></div>
</div>

<script>
    const symbols = ['🦍', '🍌', '💎', '👑', '🗿'];
    let balance = 1000;
    const bet = 50;

    function spin() {
        if (balance < bet) {
            document.getElementById('msg').innerText = "Saldo tidak cukup!";
            return;
        }

        balance -= bet;
        updateBalance();

        const btn = document.getElementById('spinBtn');
        btn.disabled = true;
        document.getElementById('msg').innerText = "Memutar...";

        let reel1 = document.getElementById('reel1');
        let reel2 = document.getElementById('reel2');
        let reel3 = document.getElementById('reel3');

        // Efek acak memutar
        let interval = setInterval(() => {
            reel1.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            reel2.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            reel3.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        }, 100);

        setTimeout(() => {
            clearInterval(interval);

            // Hasil akhir
            const res1 = symbols[Math.floor(Math.random() * symbols.length)];
            const res2 = symbols[Math.floor(Math.random() * symbols.length)];
            const res3 = symbols[Math.floor(Math.random() * symbols.length)];

            reel1.innerText = res1;
            reel2.innerText = res2;
            reel3.innerText = res3;

            checkWin(res1, res2, res3);
            btn.disabled = false;
        }, 1500);
    }

    function checkWin(r1, r2, r3) {
        if (r1 === r2 && r2 === r3) {
            let reward = (r1 === '🦍') ? 1000 : 300;
            balance += reward;
            document.getElementById('msg').innerText = `JACKPOT! Menang ${reward} Poin!`;
        } else if (r1 === r2 || r2 === r3 || r1 === r3) {
            balance += 100;
            document.getElementById('msg').innerText = "Menang Kecil! +100 Poin";
        } else {
            document.getElementById('msg').innerText = "Coba Lagi!";
        }
        updateBalance();
    }

    function updateBalance() {
        document.getElementById('balance').innerText = balance;
    }
</script>

</body>
</html>
