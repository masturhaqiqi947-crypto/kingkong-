<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingkong & Mahjong Slot Simulator</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }

        .game-container {
            background: linear-gradient(145deg, #2a1810, #150a04);
            border: 4px solid #ffd700;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            width: 320px;
            transition: all 0.3s ease;
        }

        .theme-mahjong {
            background: linear-gradient(145deg, #0d3b1e, #051a0d);
            border-color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        h1 {
            color: #ffd700;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px #000;
        }

        .game-select {
            margin-bottom: 15px;
        }

        .game-select button {
            background: #333;
            color: #fff;
            border: 1px solid #ffd700;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .game-select button.active {
            background: #ffd700;
            color: #000;
        }

        .slot-machine {
            display: flex;
            justify-content: space-around;
            background: #000;
            border: 3px solid #ff8c00;
            border-radius: 10px;
            padding: 15px 5px;
            margin: 15px 0;
            font-size: 3rem;
        }

        .theme-mahjong .slot-machine {
            border-color: #00ff88;
        }

        .reel {
            width: 80px;
            height: 80px;
            background: #222;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px #000;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-wallet {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-depo { background: #28a745; color: white; }
        .btn-wd { background: #dc3545; color: white; }

        .spin-btn {
            width: 100%;
            background: linear-gradient(180deg, #ff8c00, #ff0000);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
        }

        .theme-mahjong .spin-btn {
            background: linear-gradient(180deg, #00ff88, #008844);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.4);
            color: #000;
        }

        .spin-btn:disabled {
            background: #555 !important;
            cursor: not-allowed;
        }

        .msg {
            height: 25px;
            color: #00ffcc;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="game-container" id="container">
    <h1 id="title">🦍 KINGKONG 🦍</h1>
    
    <!-- Pilihan Game -->
    <div class="game-select">
        <button id="btnKingkong" class="active" onclick="switchGame('kingkong')">Kingkong</button>
        <button id="btnMahjong" onclick="switchGame('mahjong')">Mahjong</button>
    </div>

    <!-- Tampilan Slot -->
    <div class="slot-machine">
        <div class="reel" id="reel1">🦍</div>
        <div class="reel" id="reel2">🍌</div>
        <div class="reel" id="reel3">💎</div>
    </div>

    <!-- Panel Informasi Saldo -->
    <div class="info-panel">
        <span>Saldo: <span id="balance" style="color:#00ff00;">1000</span></span>
        <span>Bet: <span id="bet">50</span></span>
    </div>

    <!-- Tombol Wallet Deposit & Withdraw -->
    <div class="action-btns">
        <button class="btn-wallet btn-depo" onclick="deposit()">+ Deposit</button>
        <button class="btn-wallet btn-wd" onclick="withdraw()">- Penarikan</button>
    </div>

    <!-- Tombol Spin -->
    <button class="spin-btn" id="spinBtn" onclick="spin()">PUTAR / SPIN</button>

    <div class="msg" id="msg"></div>
</div>

<script>
    // Konfigurasi Game
    const gameData = {
        kingkong: {
            title: "🦍 KINGKONG 🦍",
            symbols: ['🦍', '🍌', '💎', '👑', '🗿'],
            jackpotSymbol: '🦍',
            class: ''
        },
        mahjong: {
            title: "🀄 MAHJONG WAYS 🀄",
            symbols: ['🀄', '🐉', '🧧', '🪙', '🀅'],
            jackpotSymbol: '🀄',
            class: 'theme-mahjong'
        }
    };

    let currentGame = 'kingkong';
    let balance = 1000;
    const bet = 50;

    function switchGame(gameKey) {
        currentGame = gameKey;
        const config = gameData[gameKey];

        // Update UI Tema & Judul
        document.getElementById('title').innerText = config.title;
        document.getElementById('container').className = `game-container ${config.class}`;
        
        // Update Status Tombol Navigasi
        document.getElementById('btnKingkong').classList.toggle('active', gameKey === 'kingkong');
        document.getElementById('btnMahjong').classList.toggle('active', gameKey === 'mahjong');

        // Reset Reel awal
        document.getElementById('reel1').innerText = config.symbols[0];
        document.getElementById('reel2').innerText = config.symbols[1];
        document.getElementById('reel3').innerText = config.symbols[2];
        
        document.getElementById('msg').innerText = `Pindah ke mode ${gameKey.toUpperCase()}`;
    }

    function deposit() {
        const amount = prompt("Masukkan jumlah Deposit simulasi:", "500");
        if (amount && !isNaN(amount) && Number(amount) > 0) {
            balance += Number(amount);
            updateBalance();
            document.getElementById('msg').innerText = `Deposit +${amount} berhasil!`;
        }
    }

    function withdraw() {
        const amount = prompt("Masukkan jumlah Penarikan simulasi:", "200");
        if (amount && !isNaN(amount) && Number(amount) > 0) {
            if (Number(amount) <= balance) {
                balance -= Number(amount);
                updateBalance();
                document.getElementById('msg').innerText = `Penarikan -${amount} berhasil!`;
            } else {
                alert("Saldo tidak mencukupi untuk penarikan!");
            }
        }
    }

    function spin() {
        if (balance < bet) {
            document.getElementById('msg').innerText = "Saldo habis! Silakan Deposit.";
            return;
        }

        balance -= bet;
        updateBalance();

        const btn = document.getElementById('spinBtn');
        btn.disabled = true;
        document.getElementById('msg').innerText = "Memutar...";

        const currentSymbols = gameData[currentGame].symbols;
        let reel1 = document.getElementById('reel1');
        let reel2 = document.getElementById('reel2');
        let reel3 = document.getElementById('reel3');

        // Acak animasi
        let interval = setInterval(() => {
            reel1.innerText = currentSymbols[Math.floor(Math.random() * currentSymbols.length)];
            reel2.innerText = currentSymbols[Math.floor(Math.random() * currentSymbols.length)];
            reel3.innerText = currentSymbols[Math.floor(Math.random() * currentSymbols.length)];
        }, 100);

        setTimeout(() => {
            clearInterval(interval);

            // Hasil akhir
            const res1 = currentSymbols[Math.floor(Math.random() * currentSymbols.length)];
            const res2 = currentSymbols[Math.floor(Math.random() * currentSymbols.length)];
            const res3 = currentSymbols[Math.floor(Math.random() * currentSymbols.length)];

            reel1.innerText = res1;
            reel2.innerText = res2;
            reel3.innerText = res3;

            checkWin(res1, res2, res3);
            btn.disabled = false;
        }, 1500);
    }

    function checkWin(r1, r2, r3) {
        const config = gameData[currentGame];
        
        if (r1 === r2 && r2 === r3) {
            let reward = (r1 === config.jackpotSymbol) ? 1000 : 400;
            balance += reward;
            document.getElementById('msg').innerText = `JACKPOT ${currentGame.toUpperCase()}! +${reward}`;
        } else if (r1 === r2 || r2 === r3 || r1 === r3) {
            balance += 100;
            document.getElementById('msg').innerText = "Menang Kecil! +100";
        } else {
            document.getElementById('msg').innerText = "Coba Lagi!";
        }
        updateBalance();
    }

    function updateBalance() {
        document.getElementById('balance').innerText = balance;
    }
</script>

</body>
</html>
